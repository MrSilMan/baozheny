version: "3.9"

networks:
  baozhen_net:
    driver: bridge

volumes:
  postgres_data:
  redis_data:
  logs_data:

services:
  postgres:
    image: postgres:16-alpine
    container_name: baozhen_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-baozhen}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-baozhen_secret}
      POSTGRES_DB: ${POSTGRES_DB:-baozhen_db}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - baozhen_net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-baozhen} -d ${POSTGRES_DB:-baozhen_db}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  redis:
    image: redis:7-alpine
    container_name: baozhen_redis
    restart: unless-stopped
    command: >
      redis-server
      --appendonly yes
      --appendfsync everysec
      --maxmemory 256mb
      --maxmemory-policy allkeys-lru
      --requirepass ${REDIS_PASSWORD:-redis_secret}
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    networks:
      - baozhen_net
    healthcheck:
      test: ["CMD", "redis-cli", "--no-auth-warning", "-a", "${REDIS_PASSWORD:-redis_secret}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  app:
    build:
      context: .
      dockerfile: Dockerfile
      target: runner
    container_name: baozhen_app
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-baozhen}:${POSTGRES_PASSWORD:-baozhen_secret}@postgres:5432/${POSTGRES_DB:-baozhen_db}
      REDIS_URL: redis://:${REDIS_PASSWORD:-redis_secret}@redis:6379
    ports:
      - "${APP_PORT:-3000}:3000"
    volumes:
      - logs_data:/app/logs
    networks:
      - baozhen_net
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # Development-only services
  mailhog:
    image: mailhog/mailhog:latest
    container_name: baozhen_mailhog
    profiles: ["dev"]
    ports:
      - "1025:1025"
      - "8025:8025"
    networks:
      - baozhen_net

  adminer:
    image: adminer:latest
    container_name: baozhen_adminer
    profiles: ["dev"]
    restart: unless-stopped
    ports:
      - "8080:8080"
    networks:
      - baozhen_net
    depends_on:
      - postgres
